<!doctype html>
<!-- Chrome Web Store small promo tile. Rendered to promo-440x280.png by `CAPTURE_STORE=1 pnpm test:e2e`. -->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Promo tile · Account Switcher for Claude</title>
    <link rel="stylesheet" href="../site/tokens.css" />
    <style>
      html, body { width: 440px; height: 280px; overflow: hidden; }
      body {
        display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 0 36px;
        background: radial-gradient(120% 140% at 0% 0%, #3a3936 0%, #262624 55%, #1f1e1d 100%);
        font-family: var(--font-sans); color: var(--text);
      }
      .row { display: flex; align-items: center; gap: 18px; }
      img { width: 76px; height: 76px; flex: none; }
      h1 { margin: 0; font-family: var(--font-serif); font-weight: 400; font-size: 34px; line-height: 1.05; letter-spacing: -0.01em; }
      h1 span { display: block; color: var(--claude); font-size: 24px; margin-top: 4px; }
      p { margin: 0; color: var(--text-2); font-size: 15px; }
      small { color: var(--muted); font-size: 11px; }
    </style>
  </head>
  <body>
    <div class="row">
      <img src="icon-128.png" alt="" />
      <h1>Account Switcher<span>for Claude</span></h1>
    </div>
    <p>Every claude.ai account, one click away.</p>
    <small>Unofficial — not affiliated with Anthropic.</small>
  </body>
</html>
